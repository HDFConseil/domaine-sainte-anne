<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domaine de Sainte Anne — Nos liens</title>
  <meta name="description" content="Domaine de Sainte Anne, vigneron à Marcorignan (Aude) : site, boutique en ligne, Instagram, Facebook et itinéraire." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://domainedesainteanne.fr/liens" />
  <meta name="theme-color" content="#61394a" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:site_name" content="Domaine de Sainte Anne" />
  <meta property="og:title" content="Domaine de Sainte Anne — Nos liens" />
  <meta property="og:description" content="Vigneron à Marcorignan, Aude. Site, boutique en ligne, Instagram, Facebook et itinéraire." />
  <meta property="og:image" content="https://domainedesainteanne.fr/images/accueil-vigne.jpeg" />
  <meta property="og:url" content="https://domainedesainteanne.fr/liens" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bordeaux: #61394a;
      --bordeaux-dark: #3a2530;
      --creme: #B4A5AC;
      --creme-light: #e8e0e3;
      --creme-pale: #f5f0f2;
      --noir: #171717;
      --blanc: #fdfbfc;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
      background: var(--blanc);
      color: var(--noir);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 16px 32px;
    }
    .logo {
      display: block;
      width: 200px;
      max-width: 70%;
      height: auto;
      margin: 0 auto 28px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 400;
      font-size: 1.7rem;
      line-height: 1.25;
      letter-spacing: 0.04em;
      text-align: center;
      color: var(--bordeaux-dark);
    }
    .sous-titre {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--bordeaux);
    }
    .liens {
      list-style: none;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      line-height: 1.4;
      border: 1px solid var(--bordeaux);
      color: var(--bordeaux);
      background: transparent;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn:hover { background: var(--creme-pale); }
    .btn:active { background: var(--creme-light); }
    .btn-plein { background: var(--bordeaux); color: #fff; }
    .btn-plein:hover { background: var(--bordeaux-dark); border-color: var(--bordeaux-dark); color: #fff; }
    .btn-plein:active { background: var(--bordeaux-dark); }
    .btn:focus-visible { outline: 3px solid var(--bordeaux); outline-offset: 3px; }

    footer {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px 28px;
      text-align: center;
    }
    .mention {
      border-top: 1px solid var(--creme-light);
      padding-top: 18px;
      font-size: 11px;
      font-weight: 300;
      line-height: 1.6;
      color: #666;
    }
    .mention-legales {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .mention-legales a { color: var(--bordeaux); text-decoration: underline; text-underline-offset: 3px; }
    .mention-legales a:focus-visible { outline: 3px solid var(--bordeaux); outline-offset: 3px; }

    @media (min-width: 600px) {
      main { padding-top: 64px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/images/logo-steanne.png" alt="Domaine de Sainte Anne" width="1772" height="591" />
    <h1>Domaine de Sainte Anne</h1>
    <p class="sous-titre">Vigneron à Marcorignan · Aude</p>

    <ul class="liens">
      <li><a class="btn btn-plein" href="https://domainedesainteanne.fr/">Découvrir nos vins et le domaine</a></li>
      <li><a class="btn" href="https://domainedesainteanne.sumupstore.com/">Acheter nos vins en ligne</a></li>
      <li><a class="btn" href="https://www.instagram.com/domainesteanne/">Nous suivre sur Instagram</a></li>
      <li><a class="btn" href="https://www.facebook.com/p/SCEA-Domaine-de-Sainte-Anne-61558050779995/">Nous suivre sur Facebook</a></li>
      <li><a class="btn" href="https://maps.app.goo.gl/Z4jYHGeSP1oca4rr7">Nous rendre visite</a></li>
    </ul>
  </main>

  <footer>
    <p class="mention">L'abus d'alcool est dangereux pour la santé, à consommer avec modération.</p>
    <p class="mention-legales"><a href="/mentions-legales.html">Mentions légales</a></p>
  </footer>

  <!-- Vercel Web Analytics — mesure d'audience anonyme, sans cookie -->
  <script defer src="/_vercel/insights/script.js"></script>
  <!-- GoatCounter — mesure d'audience et clics utiles, sans cookie (voir /suivi.js) -->
  <script defer src="/suivi.js"></script>
</body>
</html>
